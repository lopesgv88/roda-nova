<rect x="1470" y="380" width="14" height="260" fill="#14171a"/>
<rect x="1430" y="400" width="90" height="170" rx="6" fill="#f2f2f2"/><rect x="1430" y="400" width="90" height="26" rx="6" fill="#d7d9db"/>
<circle cx="1530" cy="600" r="34" fill="#e8eaec"/><path d="M1530 570 Q1500 520 1520 490 M1530 570 Q1560 530 1550 500" stroke="#4f7a58" stroke-width="8" fill="none" stroke-linecap="round"/>
<rect width="1600" height="900" fill="#fff" opacity=".04"/>
