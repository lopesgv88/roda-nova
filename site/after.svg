<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f6"/><stop offset="1" stop-color="#d9dde1"/></linearGradient>
<pattern id="g" width="400" height="300" patternUnits="userSpaceOnUse"><rect width="400" height="300" fill="url(#w)"/><path d="M0 0H400M0 0V300" stroke="#c4c9ce" stroke-width="3"/><path d="M40 260 Q160 120 380 40" stroke="#fff" stroke-width="2" opacity=".6" fill="none"/></pattern>
<pattern id="fl" width="300" height="140" patternUnits="userSpaceOnUse"><rect width="300" height="140" fill="#2d3237"/><path d="M0 0H300M0 0V140" stroke="#1b1e22" stroke-width="4"/><path d="M30 120 Q150 40 280 20" stroke="#4a5158" stroke-width="2" fill="none"/></pattern>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#cfd8de" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f45"/><stop offset="1" stop-color="#22262a"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#g)"/>
<rect y="640" width="1600" height="260" fill="url(#fl)"/>
<rect y="636" width="1600" height="8" fill="#14171a"/>
<!-- shower niche + tile accent band -->
<rect x="130" y="250" width="200" height="120" fill="#c6ccd1"/><rect x="142" y="262" width="176" height="96" fill="#aeb5bb"/>
<rect y="396" width="760" height="10" fill="#14171a" opacity=".85"/>
