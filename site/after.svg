<rect x="900" y="470" width="520" height="120" rx="8" fill="url(#wood)"/>
<rect x="920" y="486" width="230" height="90" rx="4" fill="#2b3035"/><rect x="1170" y="486" width="230" height="90" rx="4" fill="#2b3035"/>
<rect x="1100" y="520" width="100" height="6" rx="3" fill="#c9cfd4"/>
<rect x="880" y="436" width="560" height="38" rx="6" fill="#fafafa"/>
<ellipse cx="1160" cy="446" rx="150" ry="16" fill="#e6e9ec"/>
<rect x="1154" y="372" width="12" height="62" rx="6" fill="#d9dde0"/><rect x="1154" y="368" width="52" height="10" rx="5" fill="#d9dde0"/>
<rect x="900" y="590" width="520" height="14" fill="#000" opacity=".25"/>
<!-- round mirror + led glow -->
<circle cx="1160" cy="240" r="150" fill="url(#glow)"/>
<circle cx="1160" cy="240" r="128" fill="#eef3f6" stroke="#14171a" stroke-width="10"/>
<path d="M1070 200 Q1130 120 1230 160" stroke="#fff" stroke-width="16" opacity=".8" fill="none"/>
