<path d="M120 80 L330 620" stroke="#fff" stroke-width="22" opacity=".25"/><path d="M420 80 L520 620" stroke="#fff" stroke-width="10" opacity=".2"/>
<rect x="560" y="300" width="10" height="120" rx="5" fill="#cfd4d8"/>
<!-- rain head -->
<rect x="170" y="60" width="10" height="70" fill="#d7dce0"/><rect x="110" y="120" width="130" height="14" rx="7" fill="#e9edf0"/>
<g stroke="#fff" stroke-width="2" opacity=".6"><path d="M130 140V340M150 140V360M170 140V330M190 140V350M210 140V335M225 140V355"/></g>
